<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备浏览 - 光影资产</title>
    <link rel="icon" type="image/png" href="../static/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/device-list.css">
</head>
<body>
    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        // 等待 DOM 加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
        
        // 全局变量
        let currentPage = 1;
        let pageSize = 12;
        let categories = [];
        let selectedCategoryId = '';
        let searchKeyword = '';
        
        // 加载分类
        async function loadCategories() {
            try {
                const response = await API.categories.list();
                if (response.code === 200 && response.data) {
                    categories = response.data;
                    const select = document.getElementById('categoryFilter');
                    if (select) {
                        select.innerHTML = '<option value="">全部分类</option>';
                        categories.forEach(cat => {
                            const option = document.createElement('option');
                            option.value = cat.id;
                            option.textContent = cat.name;
                            select.appendChild(option);
                        });
                    }
                } else {
                    throw new Error(response.message || '获取分类列表失败');
                }
            } catch (error) {
                console.error('加载分类失败:', error);
                const select = document.getElementById('categoryFilter');
                if (select) {
                    select.innerHTML = '<option value="">加载失败</option>';
                }
                // 显示错误提示
                if (error.message && error.message.includes('权限')) {
                    console.warn('用户可能没有权限访问分类接口，尝试继续加载设备...');
                }
            }
        }
        
        // 加载设备列表
        async function loadDevices() {
            const container = document.getElementById('deviceList');
            if (!container) return;
            
            showLoading(container);
            
            try {
                const params = {
                    page: currentPage,
                    size: pageSize,
                };
                
                if (selectedCategoryId) {
                    params.categoryId = selectedCategoryId;
                }
                
                if (searchKeyword) {
                    params.name = searchKeyword;
                }
                
                const response = await API.deviceBrowse.list(params);
                
                if (response.code === 200) {
                    const data = response.data;
                    renderDevices(data.list, data.total);
                } else {
                    container.innerHTML = showEmptyState('加载失败，请重试');
                }
            } catch (error) {
                container.innerHTML = showEmptyState('加载失败：' + error.message);
            }
        }
        
        // 渲染设备列表
        function renderDevices(devices, total) {
            const container = document.getElementById('deviceList');
            if (!container) return;
            
            if (!devices || devices.length === 0) {
                container.innerHTML = showEmptyState('暂无设备');
                return;
            }
            
            const totalPages = Math.ceil(total / pageSize);
            
            // 创建设备网格
            const grid = document.createElement('div');
            grid.className = 'device-grid';
            
            devices.forEach(device => {
                // 根据 categoryId 查找分类名称
                const category = categories.find(cat => cat.id === device.categoryId);
                const categoryName = category ? category.name : (device.categoryName || '未分类');
                
                // 获取设备整体状态
                const overallStatus = device.overallStatus || device.status || 'NORMAL';
                // 只有状态为"正常"的设备才可以申请借用
                const canBorrow = overallStatus === 'NORMAL';
                
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="device-info">
                        <div class="device-category">${categoryName}</div>
                        <h3 class="device-name">${device.name}</h3>
                        <p class="device-model">型号：${device.model}</p>
                        ${device.description ? `<p class="device-description">${device.description}</p>` : ''}
                        <div class="device-footer">
                            <button class="btn btn-primary btn-sm" data-action="borrow" data-id="${device.id}" data-name="${device.name.replace(/'/g, "\\'")}" ${!canBorrow ? 'disabled' : ''}>
                                申请借用
                            </button>
                        </div>
                    </div>
                `;
                
                // 添加事件监听器
                const borrowBtn = card.querySelector('[data-action="borrow"]');
                if (borrowBtn && !borrowBtn.disabled) {
                    borrowBtn.addEventListener('click', () => {
                        const deviceId = parseInt(borrowBtn.getAttribute('data-id'));
                        const deviceName = borrowBtn.getAttribute('data-name');
                        openBorrowModal(deviceId, deviceName);
                    });
                }
                
                grid.appendChild(card);
            });
            
            container.innerHTML = '';
            container.appendChild(grid);
            
            // 添加分页
            if (totalPages > 1) {
                const pagination = createPagination(currentPage, totalPages, (page) => {
                    currentPage = page;
                    loadDevices();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                container.appendChild(pagination);
            }
        }
        
        // 打开借用申请模态框
        function openBorrowModal(deviceId, deviceName) {
            const modal = document.getElementById('borrowModal');
            if (!modal) return;
            
            const deviceNameInput = document.getElementById('borrowDeviceName');
            if (deviceNameInput) {
                deviceNameInput.value = deviceName;
            }
            
            const deviceIdInput = document.getElementById('borrowDeviceId');
            if (deviceIdInput) {
                deviceIdInput.value = deviceId;
            }
            
            modal.classList.add('active');
        }
        
        // 关闭模态框
        function closeBorrowModal() {
            const modal = document.getElementById('borrowModal');
            if (modal) {
                modal.classList.remove('active');
            }
            const form = document.getElementById('borrowForm');
            if (form) {
                form.reset();
            }
        }
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        function initPage() {
            // 权限检查：允许用户、管理员和超级管理员访问
            const userInfo = getUserInfo();
            if (!userInfo || (userInfo.role !== 'USER' && userInfo.role !== 'ADMIN' && userInfo.role !== 'ROOT')) {
                window.location.href = '/index.html';
                return;
            }
            
            // 根据用户角色显示不同的菜单
            let menuItems;
            if (userInfo.role === 'ADMIN' || userInfo.role === 'ROOT') {
                // 管理员显示完整的管理菜单
                menuItems = [
                    {
                        href: '/admin/dashboard.html',
                        text: '仪表盘',
                        active: false,
                        icon: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>'
                    },
                    {
                        href: '/user/devices.html',
                        text: '设备浏览',
                        active: true,
                        icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>'
                    },
                    {
                        href: '/admin/devices.html',
                        text: '设备管理',
                        active: false,
                        icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>'
                    },
                    {
                        href: '/admin/categories.html',
                        text: '分类管理',
                        active: false,
                        icon: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line>'
                    },
                    {
                        href: '/admin/users.html',
                        text: '用户管理',
                        active: false,
                        icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>'
                    },
                    {
                        href: '/admin/borrow-approval.html',
                        text: '借用审批',
                        active: false,
                        icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>'
                    }
                ];
            } else {
                // 普通用户显示用户菜单
                menuItems = [
                    {
                        href: '/user/devices.html',
                        text: '设备浏览',
                        active: true,
                        icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>'
                    },
                    {
                        href: '/user/borrow-records.html',
                        text: '我的借用',
                        active: false,
                        icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>'
                    }
                ];
            }
            
            // 创建布局
            const { content } = createLayout(menuItems);
            
            // 等待内容移动到容器后再初始化
            setTimeout(async () => {
                await loadCategories();
                await loadDevices();
                
                // 搜索框事件
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', debounce(function(e) {
                        searchKeyword = e.target.value;
                        currentPage = 1;
                        loadDevices();
                    }, 300));
                }
                
                // 分类筛选事件
                const categoryFilter = document.getElementById('categoryFilter');
                if (categoryFilter) {
                    categoryFilter.addEventListener('change', function(e) {
                        selectedCategoryId = e.target.value;
                        currentPage = 1;
                        loadDevices();
                    });
                }
                
                // 绑定模态框关闭按钮
                const closeBtn = document.getElementById('closeBorrowModalBtn');
                const cancelBtn = document.getElementById('cancelBorrowBtn');
                if (closeBtn) closeBtn.addEventListener('click', closeBorrowModal);
                if (cancelBtn) cancelBtn.addEventListener('click', closeBorrowModal);
                
                // 绑定表单提交事件
                const borrowForm = document.getElementById('borrowForm');
                if (borrowForm) {
                    borrowForm.addEventListener('submit', async function(e) {
                        e.preventDefault();
                        
                        const deviceId = parseInt(document.getElementById('borrowDeviceId').value);
                        const purpose = document.getElementById('borrowPurpose').value.trim();
                        const expectedReturnDate = document.getElementById('expectedReturnDate').value;
                        
                        if (!deviceId || !purpose || !expectedReturnDate) {
                            alert('请填写完整信息');
                            return;
                        }
                        
                        const submitBtn = document.querySelector('#borrowForm button[type="submit"]');
                        const originalText = submitBtn.innerHTML;
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="loading"></span> 提交中...';
                        
                        try {
                            const response = await API.borrow.apply({
                                deviceId: deviceId,
                                purpose: purpose,
                                expectedReturnDate: expectedReturnDate
                            });
                            
                            if (response.code === 200) {
                                alert('申请借用设备已提交！');
                                closeBorrowModal();
                                loadDevices();
                            } else {
                                alert(response.message || '提交失败');
                            }
                        } catch (error) {
                            console.error('借用申请错误详情:', error);
                            const errorMsg = error.message || '提交失败，请稍后重试';
                            if (errorMsg.includes('暂无可用实例')) {
                                alert('该设备暂无可用实例，请联系管理员添加设备实例');
                            } else {
                                alert('提交失败：' + errorMsg);
                            }
                        } finally {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                        }
                    });
                }
            }, 300);
        }
    </script>
    
    <div class="page-header">
        <h1 class="page-title">设备浏览</h1>
        <p class="page-description">浏览可用设备，申请借用</p>
    </div>
    
    <div class="filter-bar">
        <div class="filter-group">
            <label>搜索设备：</label>
            <div class="search-box">
                <!-- <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg> -->
                <input type="text" id="searchInput" placeholder="输入设备名称搜索">
            </div>
        </div>
        <div class="filter-group">
            <label>设备分类：</label>
            <select id="categoryFilter">
                <option value="">加载中...</option>
            </select>
        </div>
    </div>
    
    <div id="deviceList"></div>
    
    <!-- 借用申请模态框 -->
    <div class="modal" id="borrowModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">申请借用设备</h2>
                <button class="modal-close" id="closeBorrowModalBtn">×</button>
            </div>
            <form id="borrowForm">
                <input type="hidden" id="borrowDeviceId">
                <div class="form-group">
                    <label>设备名称</label>
                    <input type="text" id="borrowDeviceName" readonly style="background-color: var(--bg-secondary);">
                </div>
                <div class="form-group">
                    <label>借用目的</label>
                    <textarea id="borrowPurpose" placeholder="请填写借用目的" required></textarea>
                </div>
                <div class="form-group">
                    <label>预计归还日期</label>
                    <input type="date" id="expectedReturnDate" required>
                </div>
                <div style="display: flex; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" id="cancelBorrowBtn">取消</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">提交申请</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 设置最小日期为今天
        document.getElementById('expectedReturnDate').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
