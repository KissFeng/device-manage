<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理 - 光影资产</title>
    <link rel="icon" type="image/png" href="../static/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <script src="../js/api.js?v=2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/chat-embed.js"></script>
    <script>
        // 等待 DOM 加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
        
        function initPage() {
            if (!requireAuth('ADMIN')) {
                return;
            }
            
            const { content } = createLayout([
            { href: '/admin/dashboard.html', text: '仪表盘', active: false, icon: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>' },
            { href: '/user/devices.html', text: '设备浏览', active: false, icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>' },
            { href: '/admin/devices.html', text: '设备管理', active: false, icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>' },
            { href: '/admin/categories.html', text: '分类管理', active: true, icon: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line>' },
            { href: '/admin/users.html', text: '用户管理', active: false, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>' },
            { href: '/admin/borrow-approval.html', text: '借用审批', active: false, icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>' }
        ]);
        
            let editingCategory = null;
            
            // 等待内容移动到容器后再初始化
            setTimeout(async () => {
                await loadCategories();
                
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('action') === 'create') {
                    openCategoryModal();
                }
                
                // 绑定按钮事件
                const addBtn = document.getElementById('addCategoryBtn');
                const closeBtn = document.getElementById('closeCategoryModalBtn');
                const cancelBtn = document.getElementById('cancelCategoryBtn');
                
                if (addBtn) addBtn.addEventListener('click', () => openCategoryModal());
                if (closeBtn) closeBtn.addEventListener('click', () => closeCategoryModal());
                if (cancelBtn) cancelBtn.addEventListener('click', () => closeCategoryModal());
                
                // 绑定表单提交事件
                const categoryForm = document.getElementById('categoryForm');
                if (categoryForm) {
                    categoryForm.addEventListener('submit', async function(e) {
                        e.preventDefault();
                        
                        const formData = {
                            name: document.getElementById('categoryName').value.trim(),
                            description: document.getElementById('categoryDescription').value.trim()
                        };
                        
                        if (!formData.name) {
                            alert('请输入分类名称');
                            return;
                        }
                        
                        const submitBtn = document.querySelector('#categoryForm button[type="submit"]');
                        const originalText = submitBtn.innerHTML;
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="loading"></span> 保存中...';
                        
                        try {
                            let response;
                            if (editingCategory) {
                                response = await API.categories.update(editingCategory.id, formData);
                            } else {
                                response = await API.categories.create(formData);
                            }
                            
                            if (response.code === 200) {
                                alert(editingCategory ? '更新成功' : '创建成功');
                                closeCategoryModal();
                                loadCategories();
                            } else {
                                alert(response.message || '操作失败');
                            }
                        } catch (error) {
                            alert('操作失败：' + error.message);
                        } finally {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                        }
                    });
                }
            }, 200);
        }
        
        // 全局变量和函数声明
        let editingCategory = null;
        
        async function loadCategories() {
            const container = document.getElementById('categoriesList');
            showLoading(container);
            
            try {
                const response = await API.categories.list();
                if (response.code === 200) {
                    renderCategories(response.data);
                } else {
                    container.innerHTML = showEmptyState('加载失败，请重试');
                }
            } catch (error) {
                container.innerHTML = showEmptyState('加载失败：' + error.message);
            }
        }
        
        function renderCategories(categories) {
            const container = document.getElementById('categoriesList');
            
            if (!categories || categories.length === 0) {
                container.innerHTML = showEmptyState('暂无分类');
                return;
            }
            
            // 创建卡片容器
            const card = document.createElement('div');
            card.className = 'card';
            
            // 创建表格容器
            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';
            
            // 创建表格
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');
            
            // 表头
            thead.innerHTML = `
                <tr>
                    <th>分类名称</th>
                    <th>描述</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            `;
            
            // 表格内容
            categories.forEach(cat => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${cat.name}</strong></td>
                    <td>${cat.description || '-'}</td>
                    <td>${formatDateTime(cat.createdAt)}</td>
                    <td>
                        <div style="display: flex; gap: var(--spacing-xs);">
                            <button class="btn btn-sm btn-secondary" data-action="edit" data-id="${cat.id}">编辑</button>
                            <button class="btn btn-sm btn-danger" data-action="delete" data-id="${cat.id}">删除</button>
                        </div>
                    </td>
                `;
                
                // 添加事件监听器
                const editBtn = tr.querySelector('[data-action="edit"]');
                editBtn.addEventListener('click', () => editCategory(cat.id));
                
                const deleteBtn = tr.querySelector('[data-action="delete"]');
                deleteBtn.addEventListener('click', () => deleteCategory(cat.id));
                
                tbody.appendChild(tr);
            });
            
            table.appendChild(thead);
            table.appendChild(tbody);
            tableContainer.appendChild(table);
            card.appendChild(tableContainer);
            
            container.innerHTML = '';
            container.appendChild(card);
        }
        
        function formatDateTime(dateTime) {
            if (!dateTime) return '-';
            return new Date(dateTime).toLocaleString('zh-CN');
        }
        
        function openCategoryModal(category = null) {
            editingCategory = category;
            const modal = document.getElementById('categoryModal');
            const form = document.getElementById('categoryForm');
            form.reset();
            
            if (category) {
                document.getElementById('categoryId').value = category.id;
                document.getElementById('categoryName').value = category.name;
                document.getElementById('categoryDescription').value = category.description || '';
                document.querySelector('.modal-title').textContent = '编辑分类';
            } else {
                document.querySelector('.modal-title').textContent = '添加分类';
            }
            
            modal.classList.add('active');
        }
        
        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
            editingCategory = null;
        }
        
        async function editCategory(id) {
            try {
                const response = await API.categories.list();
                if (response.code === 200) {
                    const category = response.data.find(c => c.id === id);
                    if (category) {
                        openCategoryModal(category);
                    }
                }
            } catch (error) {
                alert('加载分类信息失败：' + error.message);
            }
        }
        
        async function deleteCategory(id) {
            if (!confirm('确定要删除此分类吗？删除后无法恢复。')) {
                return;
            }
            
            try {
                const response = await API.categories.delete(id);
                if (response.code === 200) {
                    // alert('删除成功');
                    loadCategories();
                } else {
                    alert(response.message || '删除失败');
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }
        
    </script>
    
    <div class="page-header">
        <h1 class="page-title">分类管理</h1>
        <p class="page-description">管理设备分类信息</p>
    </div>
    
    <div class="filter-bar" style="display: flex; align-items: center; justify-content: flex-end;">
        <div class="filter-group" style="flex-shrink: 0;">
            <button class="btn btn-primary" id="addCategoryBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加分类
            </button>
        </div>
    </div>
    
    <div id="categoriesList"></div>
    
    <!-- 分类编辑模态框 -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">添加分类</h2>
                <button class="modal-close" id="closeCategoryModalBtn">×</button>
            </div>
            <form id="categoryForm">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label>分类名称 *</label>
                    <input type="text" id="categoryName" required>
                </div>
                <div class="form-group">
                    <label>分类描述</label>
                    <textarea id="categoryDescription" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: var(--spacing-md); margin-top: var(--spacing-lg);">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" id="cancelCategoryBtn">取消</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
