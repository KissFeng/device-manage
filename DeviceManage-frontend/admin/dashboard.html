<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 光影资产</title>
    <link rel="icon" type="image/png" href="../static/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <script src="../js/api.js?v=2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/chat-embed.js"></script>
    <script>
        // 等待 DOM 加载完成
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
        
        function initPage() {
            if (!requireAuth('ADMIN')) {
                return;
            }
            
            const { content } = createLayout([
            {
                href: '/admin/dashboard.html',
                text: '仪表盘',
                active: true,
                icon: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>'
            },
            {
                href: '/user/devices.html',
                text: '设备浏览',
                active: false,
                icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>'
            },
            {
                href: '/admin/devices.html',
                text: '设备管理',
                active: false,
                icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>'
            },
            {
                href: '/admin/categories.html',
                text: '分类管理',
                active: false,
                icon: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line>'
            },
            {
                href: '/admin/users.html',
                text: '用户管理',
                active: false,
                icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>'
            },
            {
                href: '/admin/borrow-approval.html',
                text: '借用审批',
                active: false,
                icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>'
            }
        ]);
        
            // 等待内容移动到容器后再加载数据
            setTimeout(async () => {
                await loadStatistics();
            }, 200);
        }
        
        async function loadStatistics() {
            try {
                // 加载统计数据
                const [devicesRes, usersRes, borrowRes] = await Promise.all([
                    API.devices.list({ page: 1, size: 1 }),
                    API.users.list({ page: 1, size: 1 }),
                    API.borrowAdmin.pending({ page: 1, size: 1 })
                ]);
                
                const totalDevicesEl = document.getElementById('totalDevices');
                const totalUsersEl = document.getElementById('totalUsers');
                const pendingBorrowsEl = document.getElementById('pendingBorrows');
                
                if (totalDevicesEl) {
                    totalDevicesEl.textContent = devicesRes.data?.total || 0;
                }
                if (totalUsersEl) {
                    totalUsersEl.textContent = usersRes.data?.total || 0;
                }
                if (pendingBorrowsEl) {
                    pendingBorrowsEl.textContent = borrowRes.data?.total || 0;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
    </script>
    
    <div class="page-header">
        <h1 class="page-title">管理仪表盘</h1>
        <p class="page-description">系统概览和快速操作</p>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background: transparent; padding: 0;">
                <img src="../static/设备总数logo.png" alt="设备总数" style="width: 64px; height: 64px; object-fit: contain;">
            </div>
            <div class="stat-content">
                <div class="stat-value" id="totalDevices">0</div>
                <div class="stat-label">设备总数</div>
            </div>
            <a href="/admin/devices.html" class="stat-link">查看详情 →</a>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon" style="background: transparent; padding: 0;">
                <img src="../static/用户总数logo.png" alt="用户总数" style="width: 64px; height: 64px; object-fit: contain;">
            </div>
            <div class="stat-content">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">用户总数</div>
            </div>
            <a href="/admin/users.html" class="stat-link">查看详情 →</a>
        </div>
        
        <div class="stat-card">
            <div class="stat-icon" style="background: transparent; padding: 0;">
                <img src="../static/待审批申请logo.png" alt="待审批申请" style="width: 64px; height: 64px; object-fit: contain;">
            </div>
            <div class="stat-content">
                <div class="stat-value" id="pendingBorrows">0</div>
                <div class="stat-label">待审批申请</div>
            </div>
            <a href="/admin/borrow-approval.html" class="stat-link">查看详情 →</a>
        </div>
    </div>
    
    <div class="quick-actions">
        <h2 class="section-title">快速操作</h2>
        <div class="actions-grid">
            <a href="/admin/devices.html?action=create" class="action-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>添加设备</span>
            </a>
            <a href="/admin/categories.html?action=create" class="action-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
                <span>添加分类</span>
            </a>
            <a href="/admin/users.html?action=create" class="action-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                <span>添加用户</span>
            </a>
            <a href="/admin/borrow-approval.html" class="action-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>审批申请</span>
            </a>
        </div>
    </div>
</body>
</html>
