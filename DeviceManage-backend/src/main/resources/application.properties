# Application Name
spring.application.name=DeviceManage-backend

# Server Configuration
server.port=9011
server.address=0.0.0.0

# MySQL Configuration (支持环境变量覆盖，不建议在生产硬编码)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/device_manage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=2000ms

# MyBatis Plus Configuration
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=chat.hbcit.devicemanagebackend.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-underline=true

# MyBatis Configuration
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=${JWT_SECRET:DeviceManageBackendSecretKey2024ForJWTTokenGeneration}
jwt.expiration=86400000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
info.app.name=光影资产 (DeviceManage) 后台管理系统
info.app.version=1.0.0
info.app.description=基于 Spring Boot 3 + MyBatis-Plus + Security + JWT + Redis 的媒体设备全生命周期资产管理平台

# Logging Configuration
logging.level.root=INFO
logging.level.chat.hbcit.devicemanagebackend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n
