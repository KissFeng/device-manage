# Application Name
spring.application.name=DeviceManage-backend

# Server Configuration
server.port=9011
server.address=0.0.0.0

# MySQL Configuration (请替换为实际数据库地址与凭据)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/device_manage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# JWT Configuration (请替换为不少于32位的随机密钥)
jwt.secret=replace-with-your-own-32-chars-minimum-secret-key
jwt.expiration=86400000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Spring AI + DeepSeek Configuration (请配置真实的 DeepSeek API Key)
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=your-deepseek-api-key
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.3
